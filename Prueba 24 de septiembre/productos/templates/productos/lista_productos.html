<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<div class="container mt-4">
    <h2>Catálogo de Productos</h2>
    <a href="{% url 'crear_producto' %}" class="btn btn-success mb-3">Nuevo Producto</a>
    <table class="table table-bordered">
        <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
        {% for p in productos %}
        <tr>
            <td>{{ p.nombre }}</td>
            <td>{{ p.descripcion|default:'Sin descripción' }}</td>
            <td>${{ p.precio }}</td>
            <td>{{ p.stock }}</td>
            <td>
                <a href="{% url 'editar_producto' p.id %}" class="btn btn-warning btn-sm">Editar</a>
                <a href="{% url 'eliminar_producto' p.id %}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5" class="text-center">No hay productos registrados.</td>
        </tr>
        {% endfor %}
    </table>
</div>
