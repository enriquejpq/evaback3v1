<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<div class="container mt-4">
    <h2>Catálogo de Productos</h2>
    <a href="{% url 'crear_producto' %}" class="btn btn-success mb-3">Nuevo Producto</a>
    <table class="table table-bordered">
        <tr><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
        {% for p in productos %}
        <tr>
            <td>{{ p.nombre }}</td><td>{{ p.descripcion }}</td><td>${{ p.precio }}</td><td>{{ p.stock }}</td>
            <td>
                <a href="{% url 'editar_producto' p.id %}" class="btn btn-warning btn-sm">Editar</a>
                <form action="{% url 'eliminar_producto' p.id %}" method="POST" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
